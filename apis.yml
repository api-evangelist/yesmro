name: yesmro
description: >-
  YESMRO (易买工品), operated by Shanghai Sheti Information Technology Co., Ltd. and
  founded in April 2016, is a self-operated Chinese B2B e-commerce platform for MRO
  (maintenance, repair and operations) and factory-automation parts. It carries
  millions of SKUs across mechanical components, industrial control (PLCs, HMIs,
  servos, drives), sensors, low-voltage electrical, pneumatics, tools, safety and
  factory consumables from 800+ brands, targeting the small and medium-sized end
  factories that make up the long tail of industrial demand. The company runs
  automated (AGV) warehouses in Shanghai, Hefei and Dongguan and 10+ regional
  offices, and in 2020 launched an open platform for upstream suppliers. It is
  backed by Qiming Venture Partners, Matrix Partners China and Sequoia Capital China.
  This profile was surfaced as a portfolio company of Qiming; no public developer
  API, open-platform docs, or specification surface was found during enrichment.
